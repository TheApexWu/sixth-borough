[project]
name = "sixth-borough"
version = "0.1.0"
description = "A time machine for niche subcultures across all five boroughs of NYC. Spark Hack NYC, Apr 10-12 2026."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["src", "src.data", "src.orchestrator"]
