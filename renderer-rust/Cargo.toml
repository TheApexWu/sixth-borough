[package]
name = "renderer-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.bevy]
version = "0.18.1"
default-features = false
features = [
    "3d",
    "webgl2",
    "bevy_gltf",
    "bevy_winit",
    "bevy_log",
    "default_font",
    "multi_threaded",
    "png",
]
