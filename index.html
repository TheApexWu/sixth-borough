<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SIXTH BOROUGH</title>
<script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://unpkg.com/deck.gl@9.1.4/dist.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; overflow: hidden; font-family: 'Courier New', monospace; color: #ddd; }
  #map { width: 100vw; height: 100vh; }

  /* ── Title ── */
  #title-bar {
    position: fixed; top: 24px; left: 24px; z-index: 10;
    pointer-events: none;
  }
  #title-bar h1 { font-size: 26px; letter-spacing: 4px; color: #fff; }
  #title-bar .sub { font-size: 11px; color: #555; letter-spacing: 1px; margin-top: 4px; }

  /* ── Era legend (vertical, right side) ── */
  #legend {
    position: fixed; top: 24px; right: 24px; z-index: 25;
    background: rgba(0,0,0,0.85); border: 1px solid #282828; padding: 14px 16px;
  }
  #legend h3 { font-size: 11px; letter-spacing: 3px; color: #00b8d4; margin-bottom: 10px; }
  .leg {
    display: flex; align-items: center; margin: 2px 0; padding: 4px 6px;
    cursor: pointer; transition: background 0.3s;
    border-radius: 2px;
  }
  .leg:hover { background: rgba(255,255,255,0.04); }
  .leg.active { background: rgba(255,255,255,0.07); }
  .leg .sw {
    width: 10px; height: 10px; margin-right: 8px; border: 1px solid #333;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .leg:hover .sw { transform: scale(1.2); }
  .leg.active .sw { transform: scale(1.3); box-shadow: 0 0 6px currentColor; }
  .leg .leg-label {
    font-size: 11px; color: #888; transition: color 0.3s;
  }
  .leg.active .leg-label { color: #ccc; }
  .leg .leg-years {
    font-size: 10px; color: #444; margin-left: auto; padding-left: 12px;
    transition: color 0.3s;
  }
  .leg.active .leg-years { color: #666; }

  /* ── Timeline controls ── */
  #controls {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 25;
    background: rgba(0,0,0,0.92); border: 1px solid #282828; padding: 18px 44px;
    text-align: center; min-width: 520px;
  }
  #controls .label { font-size: 11px; letter-spacing: 4px; color: #00b8d4; }
  #year-display { font-size: 56px; font-weight: bold; color: #fff; margin: 6px 0; font-variant-numeric: tabular-nums; }
  #era-label { font-size: 11px; color: #666; letter-spacing: 2px; margin-bottom: 14px; }
  #slider {
    width: 100%; -webkit-appearance: none; height: 3px;
    background: #282828; outline: none; cursor: pointer;
  }
  #slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: #00b8d4; border-radius: 50%; cursor: pointer;
  }
  #stats { margin-top: 8px; font-size: 10px; color: #555; }
  #slider-wrap { position: relative; width: 100%; height: 24px; }
  #slider-wrap input { position: absolute; top: 50%; left: 0; width: 100%; transform: translateY(-50%); z-index: 2; }
  .era-dot {
    position: absolute; z-index: 3; width: 10px; height: 10px; border-radius: 50%;
    border: 1.5px solid #444; background: #111; cursor: pointer;
    top: 50%; transform: translate(-50%, -50%);
    transition: border-color 0.3s, background 0.3s, transform 0.2s;
  }
  .era-dot:hover { border-color: #00b8d4; background: #00b8d4; transform: translate(-50%, -50%) scale(1.3); }
  .era-dot-label {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-size: 8px; color: #333; letter-spacing: 1px; white-space: nowrap;
    pointer-events: none; opacity: 0; transition: opacity 0.3s, color 0.3s;
  }
  .era-dot:hover .era-dot-label { opacity: 1; color: #666; }
  #play-btn {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: none; border: 1px solid #333; color: #888; font-family: inherit;
    font-size: 11px; padding: 6px 12px; cursor: pointer; letter-spacing: 1px;
  }
  #play-btn:hover { color: #00b8d4; border-color: #00b8d4; }

  /* ── Mode toggle ── */
  #mode-toggle {
    position: fixed; bottom: 28px; left: 24px; z-index: 10;
    background: rgba(0,0,0,0.92); border: 1px solid #282828;
    color: #888; font-family: inherit; font-size: 10px; letter-spacing: 2px;
    padding: 10px 16px; cursor: pointer;
  }
  #mode-toggle:hover { color: #00b8d4; border-color: #00b8d4; }
  #mode-toggle.active { color: #00b8d4; border-color: #00b8d4; }

  /* ── Station bar (guided mode) ── */
  #station-bar {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(0,0,0,0.92); border: 1px solid #282828; padding: 18px 44px;
    text-align: center; min-width: 520px; display: none;
  }
  #station-bar .label { font-size: 11px; letter-spacing: 4px; color: #00b8d4; margin-bottom: 14px; }
  .station-track {
    display: flex; align-items: center; justify-content: center; gap: 0; margin: 16px 0 8px;
    position: relative;
  }
  .station-line {
    height: 2px; background: #282828; flex: 1;
  }
  .station-dot {
    width: 16px; height: 16px; border-radius: 50%; border: 2px solid #444;
    background: #111; cursor: pointer; position: relative; z-index: 1;
    transition: border-color 0.3s, background 0.3s;
  }
  .station-dot:hover { border-color: #00b8d4; }
  .station-dot.active { border-color: #00b8d4; background: #00b8d4; }
  .station-label {
    font-size: 9px; color: #555; letter-spacing: 1px; margin-top: 6px;
  }
  .station-item { display: flex; flex-direction: column; align-items: center; }
  #station-nav {
    margin-top: 10px; font-size: 10px; color: #555;
  }

  /* ── Cutscene overlay ── */
  #cutscene {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 20;
    background: rgba(0,0,0,0); pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  #cutscene-inner {
    max-width: 620px; width: 90%;
  }

  /* GSAP controls reveal animation — set initial hidden state */
  .cs-reveal {
    opacity: 0; transform: translateY(16px);
    will-change: opacity, transform;
  }

  .cs-era {
    font-size: 11px; letter-spacing: 6px; margin-bottom: 8px;
  }
  .cs-title {
    font-size: 38px; font-weight: bold; color: #fff; line-height: 1.15; margin-bottom: 2px;
  }
  .cs-years {
    font-size: 13px; color: #555; letter-spacing: 3px; margin-bottom: 32px;
  }
  .cs-photos {
    display: flex; gap: 10px; margin-bottom: 28px; overflow: hidden;
  }
  .cs-photo {
    flex: 1; height: 180px; background: #111; border: 1px solid #1e1e1e;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: #2a2a2a; letter-spacing: 1px;
    overflow: hidden; position: relative;
  }
  /* Ken Burns drift on photo placeholders */
  @keyframes kenBurns {
    0%   { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1.08) translate(-2%, -1%); }
  }
  #cutscene.active .cs-photo {
    animation: kenBurns 12s ease-in-out alternate infinite;
  }
  #cutscene.active .cs-photo:nth-child(2) { animation-delay: -4s; animation-direction: alternate-reverse; }
  #cutscene.active .cs-photo:nth-child(3) { animation-delay: -8s; }

  .cs-quote {
    border-left: 2px solid; padding: 14px 24px; margin-bottom: 28px;
    font-size: 15px; color: #ccc; font-style: italic; line-height: 1.65;
  }
  .cs-attribution {
    font-size: 10px; color: #555; font-style: normal; margin-top: 10px; letter-spacing: 1px;
  }
  .cs-body {
    font-size: 12px; color: #777; line-height: 1.8; margin-bottom: 32px;
  }
  .cs-buttons {
    display: flex; gap: 12px;
  }
  .cs-btn {
    background: none; border: 1px solid #333; color: #888; font-family: inherit;
    font-size: 10px; letter-spacing: 2px; padding: 10px 20px; cursor: pointer;
    transition: color 0.3s, border-color 0.3s, transform 0.15s;
  }
  .cs-btn:hover { color: #00b8d4; border-color: #00b8d4; transform: translateY(-1px); }
  .cs-btn:active { transform: translateY(0); }
  .cs-btn.primary { border-color: #00b8d4; color: #00b8d4; }

  /* ── Dev tools panel ── */
  #dev-panel {
    position: fixed; top: 0; right: 0; z-index: 40;
    width: 280px; height: 100vh;
    background: rgba(6,6,6,0.96); border-left: 1px solid #222;
    transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    overflow-y: auto; padding: 0;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  #dev-panel.open { transform: translateX(0); }
  #dev-panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; border-bottom: 1px solid #1a1a1a;
    position: sticky; top: 0; background: rgba(6,6,6,0.98); z-index: 1;
  }
  #dev-panel-header h4 {
    font-size: 10px; letter-spacing: 3px; color: #555; margin: 0;
  }
  #dev-close {
    background: none; border: none; color: #444; font-size: 16px;
    cursor: pointer; font-family: inherit; padding: 0;
  }
  #dev-close:hover { color: #888; }
  #dev-toggle {
    position: fixed; top: 16px; right: 16px; z-index: 35;
    background: rgba(0,0,0,0.8); border: 1px solid #282828;
    color: #444; font-family: inherit; font-size: 9px; letter-spacing: 2px;
    padding: 6px 10px; cursor: pointer;
    transition: color 0.3s, border-color 0.3s;
  }
  #dev-toggle:hover { color: #888; border-color: #444; }
  .flag-section {
    padding: 14px 18px 8px; border-bottom: 1px solid #111;
  }
  .flag-section-title {
    font-size: 9px; letter-spacing: 2px; color: #333; margin-bottom: 10px;
    text-transform: uppercase;
  }
  .flag-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 0;
  }
  .flag-label { font-size: 11px; color: #888; }
  .flag-desc { font-size: 9px; color: #333; margin-top: 2px; }
  .flag-toggle {
    position: relative; width: 32px; height: 16px; cursor: pointer; flex-shrink: 0;
  }
  .flag-toggle input { opacity: 0; width: 0; height: 0; }
  .flag-slider {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: #222; border-radius: 8px; transition: background 0.3s;
  }
  .flag-slider::before {
    content: ''; position: absolute; left: 2px; top: 2px;
    width: 12px; height: 12px; border-radius: 50%;
    background: #555; transition: transform 0.3s, background 0.3s;
  }
  .flag-toggle input:checked + .flag-slider { background: #0a3d47; }
  .flag-toggle input:checked + .flag-slider::before { transform: translateX(16px); background: #00b8d4; }

  /* Radio-style mode selector */
  .mode-option {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 8px 0; cursor: pointer;
  }
  .mode-option:hover .mode-name { color: #ccc; }
  .mode-radio {
    width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #444;
    background: #111; flex-shrink: 0; margin-top: 1px;
    transition: border-color 0.3s, background 0.3s;
    display: flex; align-items: center; justify-content: center;
  }
  .mode-radio::after {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: transparent; transition: background 0.3s;
  }
  .mode-option.active .mode-radio { border-color: #00b8d4; }
  .mode-option.active .mode-radio::after { background: #00b8d4; }
  .mode-name { font-size: 11px; color: #888; transition: color 0.2s; }
  .mode-desc { font-size: 9px; color: #444; margin-top: 2px; line-height: 1.4; }

  /* ── 3D Vignette overlay ── */
  #vignette {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 20;
    pointer-events: none; display: flex; align-items: flex-end;
    padding: 0 60px 140px;
  }
  #vignette.active { pointer-events: auto; }
  .vignette-items {
    display: flex; gap: 24px; align-items: flex-end; width: 100%;
    justify-content: center;
  }
  .vignette-card {
    width: 160px; background: rgba(0,0,0,0.7); border: 1px solid #222;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 12px; opacity: 0; transform: translateY(30px) scale(0.95);
    will-change: opacity, transform;
  }
  .vignette-card .vc-icon {
    width: 100%; height: 120px; background: #111; border: 1px solid #1a1a1a;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; margin-bottom: 10px; color: #333;
  }
  .vignette-card .vc-label {
    font-size: 9px; letter-spacing: 1px; color: #666; text-align: center;
  }
  .vignette-card .vc-year {
    font-size: 8px; color: #333; text-align: center; margin-top: 3px;
  }
  .vignette-era-label {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 11px; letter-spacing: 8px; color: #333;
    opacity: 0; will-change: opacity;
    pointer-events: none;
  }
  .vignette-nav {
    position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
    z-index: 21; display: flex; gap: 12px; opacity: 0;
    will-change: opacity;
  }

  /* ── Story card (scaffold) ── */
  #story-card {
    position: fixed; bottom: 120px; right: 24px; z-index: 10;
    background: rgba(0,0,0,0.92); border: 1px solid #282828;
    width: 320px; display: none;
  }
  #story-card .card-header {
    padding: 12px 16px; border-bottom: 1px solid #1a1a1a;
    font-size: 10px; letter-spacing: 3px; color: #00b8d4;
  }
  #story-card .card-title {
    padding: 12px 16px 4px; font-size: 16px; color: #fff; line-height: 1.3;
  }
  #story-card .card-year {
    padding: 0 16px; font-size: 11px; color: #555;
  }
  #story-card .card-body {
    padding: 10px 16px 16px; font-size: 12px; color: #999; line-height: 1.6;
  }
  #story-card .card-close {
    position: absolute; top: 8px; right: 12px; background: none; border: none;
    color: #555; font-size: 16px; cursor: pointer; font-family: inherit;
  }
  #story-card .card-close:hover { color: #fff; }
  #story-card .card-footer {
    padding: 8px 16px 12px; border-top: 1px solid #1a1a1a;
    font-size: 9px; color: #333; letter-spacing: 1px;
  }
</style>
</head>
<body>

<div id="title-bar">
  <h1>SIXTH BOROUGH</h1>
  <div class="sub">MANHATTAN / <span id="total-count">--</span> BUILDINGS / 1719-2026</div>
</div>

<div id="legend"></div>

<div id="controls">
  <div class="label">TIMELINE</div>
  <div id="year-display">2026</div>
  <div id="era-label">GLASS TOWER ERA</div>
  <div id="slider-wrap">
    <input type="range" id="slider" min="1719" max="2026" value="2026" step="1">
  </div>
  <div id="stats"><span id="visible-count">--</span> buildings visible</div>
  <button id="play-btn">PLAY</button>
</div>

<!-- Story card scaffold -- Carson/James decide layout, fonts, tone -->
<div id="story-card">
  <button class="card-close" onclick="closeCard()">&times;</button>
  <div class="card-header">SITE HISTORY</div>
  <div class="card-title" id="card-title">--</div>
  <div class="card-year" id="card-year">--</div>
  <div class="card-body" id="card-body">--</div>
  <div class="card-footer">NARRATED BY NEMOTRON 3 NANO / GB10 BLACKWELL</div>
</div>

<button id="dev-toggle" onclick="toggleDevPanel()">DEV</button>
<div id="dev-panel">
  <div id="dev-panel-header">
    <h4>FEATURE FLAGS</h4>
    <button id="dev-close" onclick="toggleDevPanel()">&times;</button>
  </div>
  <div id="dev-panel-body"></div>
</div>

<!-- 3D Vignette overlay (alternative to cutscene) -->
<div id="vignette">
  <div class="vignette-era-label" id="vignette-era-label"></div>
  <div class="vignette-items" id="vignette-items"></div>
  <div class="vignette-nav">
    <button class="cs-btn" onclick="exitVignette()">EXPLORE THIS ERA</button>
    <button class="cs-btn primary" id="vignette-next-btn" onclick="nextStation()">NEXT STATION →</button>
  </div>
</div>

<button id="mode-toggle" onclick="toggleMode()">GUIDED TOUR</button>

<div id="station-bar">
  <div class="label">GUIDED TOUR</div>
  <div class="station-track" id="station-track"></div>
  <div id="station-nav"></div>
</div>

<!-- Cutscene overlay -->
<div id="cutscene">
  <div id="cutscene-inner">
    <div class="cs-reveal"><div class="cs-era" id="cs-era">ERA</div></div>
    <div class="cs-reveal"><div class="cs-title" id="cs-title">--</div></div>
    <div class="cs-reveal"><div class="cs-years" id="cs-years">--</div></div>
    <div class="cs-reveal"><div class="cs-photos" id="cs-photos"></div></div>
    <div class="cs-reveal"><div class="cs-quote" id="cs-quote">--</div></div>
    <div class="cs-reveal"><div class="cs-body" id="cs-body">--</div></div>
    <div class="cs-reveal cs-buttons">
      <button class="cs-btn" onclick="exitCutscene()">EXPLORE THIS ERA</button>
      <button class="cs-btn primary" id="cs-next-btn" onclick="nextStation()">NEXT STATION →</button>
    </div>
  </div>
</div>

<div id="map"></div>

<script>
const { Deck, PolygonLayer } = deck;

// ── Feature Flags ──
const FLAGS = {
  eraDots:      { label: 'Era Dots', desc: 'Clickable dots on timeline rail', group: 'ui', default: true },
  guidedMode:   { label: 'Guided Tour Mode', desc: 'Station bar with sequential navigation', group: 'ui', default: true },
  storyCards:   { label: 'Story Cards', desc: 'Info card on building click', group: 'ui', default: true },
  legend:       { label: 'Era Legend', desc: 'Interactive era bar above timeline', group: 'ui', default: true },
};

// Cutscene modes — only one active at a time
const CUTSCENE_MODES = {
  overlay:  { label: 'Overlay Cutscene', desc: 'Full-screen overlay with photos, quotes, and text. Covers the map.' },
  vignette: { label: '3D Vignette', desc: 'Floating artifact cards appear in-world over the map. No overlay — the city stays visible.' },
  off:      { label: 'Off', desc: 'No cutscene after flying to a station.' },
};

// Load from localStorage, fall back to defaults
const featureFlags = {};
for (const [key, def] of Object.entries(FLAGS)) {
  const stored = localStorage.getItem('ff_' + key);
  featureFlags[key] = stored !== null ? stored === 'true' : def.default;
}
let cutsceneMode = localStorage.getItem('ff_cutsceneMode') || 'overlay';

function setFlag(key, val) {
  featureFlags[key] = val;
  localStorage.setItem('ff_' + key, val);
  applyFlags();
}

function setCutsceneMode(mode) {
  cutsceneMode = mode;
  localStorage.setItem('ff_cutsceneMode', mode);
  // Update radio UI
  document.querySelectorAll('.mode-option').forEach(el => {
    el.classList.toggle('active', el.dataset.mode === mode);
  });
}

function applyFlags() {
  document.querySelectorAll('.era-dot').forEach(d => d.style.display = featureFlags.eraDots ? '' : 'none');
  document.getElementById('mode-toggle').style.display = featureFlags.guidedMode ? '' : 'none';
  if (!featureFlags.guidedMode && guidedMode) toggleMode();
  document.getElementById('legend').style.display = featureFlags.legend ? '' : 'none';
}

function toggleDevPanel() {
  document.getElementById('dev-panel').classList.toggle('open');
}

function buildDevPanel() {
  const body = document.getElementById('dev-panel-body');
  body.innerHTML = '';

  // UI toggles section
  const uiSection = document.createElement('div');
  uiSection.className = 'flag-section';
  uiSection.innerHTML = '<div class="flag-section-title">Interface</div>';
  for (const [key, def] of Object.entries(FLAGS)) {
    const row = document.createElement('div');
    row.className = 'flag-row';
    const labelWrap = document.createElement('div');
    const label = document.createElement('div');
    label.className = 'flag-label';
    label.textContent = def.label;
    const desc = document.createElement('div');
    desc.className = 'flag-desc';
    desc.textContent = def.desc;
    labelWrap.appendChild(label);
    labelWrap.appendChild(desc);
    const toggle = document.createElement('label');
    toggle.className = 'flag-toggle';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = featureFlags[key];
    input.addEventListener('change', () => setFlag(key, input.checked));
    const slider = document.createElement('span');
    slider.className = 'flag-slider';
    toggle.appendChild(input);
    toggle.appendChild(slider);
    row.appendChild(labelWrap);
    row.appendChild(toggle);
    uiSection.appendChild(row);
  }
  body.appendChild(uiSection);

  // Cutscene modes section
  const csSection = document.createElement('div');
  csSection.className = 'flag-section';
  csSection.innerHTML = '<div class="flag-section-title">Era Presentation</div>';
  for (const [mode, def] of Object.entries(CUTSCENE_MODES)) {
    const option = document.createElement('div');
    option.className = 'mode-option' + (cutsceneMode === mode ? ' active' : '');
    option.dataset.mode = mode;
    option.addEventListener('click', () => setCutsceneMode(mode));
    const radio = document.createElement('div');
    radio.className = 'mode-radio';
    const textWrap = document.createElement('div');
    const name = document.createElement('div');
    name.className = 'mode-name';
    name.textContent = def.label;
    const desc = document.createElement('div');
    desc.className = 'mode-desc';
    desc.textContent = def.desc;
    textWrap.appendChild(name);
    textWrap.appendChild(desc);
    option.appendChild(radio);
    option.appendChild(textWrap);
    csSection.appendChild(option);
  }
  body.appendChild(csSection);
}
buildDevPanel();

// ── Era classification + colors ──
const ERA_DEFS = [
  { max: 1800, label: 'COLONIAL ERA',            color: [80, 60, 50] },
  { max: 1860, label: 'ANTEBELLUM',              color: [120, 85, 60] },
  { max: 1900, label: 'GILDED AGE',              color: [160, 110, 70] },
  { max: 1930, label: 'GOLDEN AGE',              color: [180, 140, 80] },
  { max: 1945, label: 'ART DECO / DEPRESSION',   color: [100, 130, 160] },
  { max: 1970, label: 'BRUTALISM / MIDCENTURY',   color: [130, 130, 130] },
  { max: 2000, label: 'POSTMODERN',              color: [90, 110, 90] },
  { max: 9999, label: 'GLASS TOWER ERA',         color: [60, 180, 200] },
];

// Era ranges for legend display (min is inclusive, max from ERA_DEFS is exclusive)
const ERA_RANGES = [
  { min: 0,    max: 1800, label: 'COLONIAL',    shortYears: 'PRE-1800' },
  { min: 1800, max: 1860, label: 'ANTEBELLUM',  shortYears: '1800–1860' },
  { min: 1860, max: 1900, label: 'GILDED AGE',  shortYears: '1860–1900' },
  { min: 1900, max: 1930, label: 'GOLDEN AGE',  shortYears: '1900–1930' },
  { min: 1930, max: 1945, label: 'ART DECO',    shortYears: '1930–1945' },
  { min: 1945, max: 1970, label: 'MIDCENTURY',  shortYears: '1945–1970' },
  { min: 1970, max: 2000, label: 'POSTMODERN',  shortYears: '1970–2000' },
  { min: 2000, max: 9999, label: 'GLASS TOWER', shortYears: '2000+' },
];

function getEra(year) {
  for (const e of ERA_DEFS) { if (year < e.max) return e; }
  return ERA_DEFS[ERA_DEFS.length - 1];
}

function getEraIndex(year) {
  for (let i = 0; i < ERA_DEFS.length; i++) { if (year < ERA_DEFS[i].max) return i; }
  return ERA_DEFS.length - 1;
}

// ── Interactive era legend ──
function buildLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = '<h3>ERA</h3>';
  ERA_DEFS.forEach((era, i) => {
    const range = ERA_RANGES[i];
    const leg = document.createElement('div');
    leg.className = 'leg';
    leg.dataset.eraIndex = i;

    const sw = document.createElement('div');
    sw.className = 'sw';
    sw.style.background = `rgb(${era.color.join(',')})`;
    sw.style.color = `rgb(${era.color.join(',')})`;

    const label = document.createElement('span');
    label.className = 'leg-label';
    label.textContent = range.label;

    const years = document.createElement('span');
    years.className = 'leg-years';
    years.textContent = range.shortYears;

    leg.appendChild(sw);
    leg.appendChild(label);
    leg.appendChild(years);

    leg.addEventListener('click', () => {
      const stationIdx = findStationForEra(i);
      if (stationIdx !== -1) {
        goToStation(stationIdx);
      } else {
        const midYear = range.max === 9999 ? 2020 : Math.round((range.min + range.max) / 2);
        const proxy = { year: currentYear };
        gsap.to(proxy, {
          year: midYear,
          duration: 1.5,
          ease: 'power3.out',
          onUpdate: () => syncYear(proxy.year),
        });
      }
    });

    legend.appendChild(leg);
  });
  updateLegendHighlight();
}

function findStationForEra(eraIndex) {
  const range = ERA_RANGES[eraIndex];
  for (let i = 0; i < STATIONS.length; i++) {
    if (STATIONS[i].targetYear >= range.min && STATIONS[i].targetYear < range.max) return i;
  }
  return -1;
}

function updateLegendHighlight() {
  const activeIdx = getEraIndex(currentYear);
  document.querySelectorAll('#legend .leg').forEach((leg, i) => {
    leg.classList.toggle('active', i === activeIdx);
  });
}

function initDeck() {
  deckgl = new Deck({
    parent: document.getElementById('map'),
    initialViewState: {
      latitude: 40.758,
      longitude: -73.985,
      zoom: 14,
      pitch: 55,
      bearing: -20,
      maxZoom: 18,
      minZoom: 10,
    },
    controller: true,
    layers: [buildLayer()],
    getTooltip: ({object}) => {
      if (!object) return null;
      const era = getEra(object.y);
      return {
        html: `<b>${era.label}</b><br>Built: ${object.y || '?'}<br>Height: ${object.h}m<br>BIN: ${object.b}`,
        style: { backgroundColor: 'rgba(0,0,0,0.9)', color: '#ddd', fontFamily: "'Courier New', monospace", fontSize: '11px', padding: '8px 12px', borderLeft: '2px solid #00b8d4' }
      };
    },
    onClick: ({object}) => {
      if (!object) return;
      showCard(object);
    },
  });
}

function buildLayer() {
  return new PolygonLayer({
    id: 'buildings',
    data: buildings,
    getPolygon: d => d.p,
    // Height grow: buildings built after currentYear get 0 height.
    // Buildings built AT currentYear get partial height (grow effect within a 3-year window).
    getElevation: d => {
      if (d.y === 0) return d.h;  // unknown year, always show
      if (d.y > currentYear) return 0;
      // Grow over a 3-year window ending at construction year
      const growStart = d.y - 3;
      if (currentYear < growStart) return 0;
      if (currentYear >= d.y) return d.h;
      // Lerp: fraction of the 3-year grow window
      const t = (currentYear - growStart) / 3;
      return d.h * t;
    },
    getFillColor: d => {
      if (d.y > currentYear && d.y !== 0) return [0, 0, 0, 0]; // invisible future
      const era = getEra(d.y || 1800);
      // Fade in during grow window
      let alpha = 200;
      if (d.y !== 0 && d.y > 0) {
        const growStart = d.y - 3;
        if (currentYear < d.y && currentYear >= growStart) {
          alpha = Math.floor(80 + 120 * ((currentYear - growStart) / 3));
        }
      }
      return [...era.color, alpha];
    },
    extruded: true,
    wireframe: false,
    pickable: true,
    elevationScale: 1,
    material: {
      ambient: 0.4,
      diffuse: 0.6,
      shininess: 10,
      specularColor: [30, 30, 30],
    },
    updateTriggers: {
      getElevation: currentYear,
      getFillColor: currentYear,
    },
    transitions: {
      getElevation: { duration: 200, easing: t => t },
    },
  });
}

const eraLabel = document.getElementById('era-label');

  currentYear = parseInt(slider.value);
  yearDisplay.textContent = currentYear;
  eraLabel.textContent = getEra(currentYear).label;
  updateVisibleCount();
  updateLegendHighlight();
  if (deckgl) deckgl.setProps({ layers: [buildLayer()] });
});

function updateVisibleCount() {
  const count = buildings.filter(b => b.y === 0 || b.y <= currentYear).length;
  document.getElementById('visible-count').textContent = count.toLocaleString();
}

// ── Play button (GSAP-driven timeline scrub) ──
const playBtn = document.getElementById('play-btn');
let playTween = null;

function syncYear(year) {
  currentYear = Math.round(year);
  slider.value = currentYear;
  yearDisplay.textContent = currentYear;
  eraLabel.textContent = getEra(currentYear).label;
  updateVisibleCount();
  updateLegendHighlight();
  if (deckgl) deckgl.setProps({ layers: [buildLayer()] });
}

playBtn.addEventListener('click', () => {
  if (playing) {
    playTween.kill();
    playBtn.textContent = 'PLAY';
    playing = false;
  } else {
    const startFrom = currentYear >= 2026 ? 1719 : currentYear;
    const yearsToGo = 2026 - startFrom;
    const duration = yearsToGo / 20; // ~20 years/second
    playing = true;
    playBtn.textContent = 'STOP';
    const proxy = { year: startFrom };
    playTween = gsap.to(proxy, {
      year: 2026,
      duration,
      ease: 'none',
      onUpdate: () => syncYear(proxy.year),
      onComplete: () => {
        playBtn.textContent = 'PLAY';
        playing = false;
      }
    });
  }
});

// ── Story card ──
function showCard(building) {
  if (!featureFlags.storyCards) return;
  const card = document.getElementById('story-card');
  const marquee = MARQUEE[building.b];
  if (marquee) {
    document.getElementById('card-title').textContent = marquee.title;
    document.getElementById('card-year').textContent = `Built ${marquee.year}`;
    document.getElementById('card-body').textContent = marquee.body;
  } else {
    const era = getEra(building.y);
    document.getElementById('card-title').textContent = `BIN ${building.b}`;
    document.getElementById('card-year').textContent = building.y ? `Built ${building.y} / ${era.label}` : 'Construction year unknown';
    document.getElementById('card-body').textContent = `${building.h}m tall. ${era.label.toLowerCase()} construction. At the hackathon, clicking any building triggers Nemotron to generate a site-specific narrative using the building's metadata + surrounding historical context.`;
  }
  card.style.display = 'block';
}

function closeCard() {
  document.getElementById('story-card').style.display = 'none';
}

// ── Era dots on timeline ──
function buildEraDots() {
  const wrap = document.getElementById('slider-wrap');
  const min = 1719, max = 2026;
  STATIONS.forEach((s, i) => {
    const pct = ((s.targetYear - min) / (max - min)) * 100;
    const dot = document.createElement('div');
    dot.className = 'era-dot';
    dot.style.left = pct + '%';
    dot.title = s.label;
    dot.innerHTML = '<span class="era-dot-label">' + s.label + '</span>';
    dot.addEventListener('click', (e) => {
      e.stopPropagation();
      goToStation(i);
    });
    wrap.appendChild(dot);
  });
}

let guidedMode = false;
let activeStationIndex = -1;
let cutsceneOpen = false;

function toggleMode() {
  guidedMode = !guidedMode;
  const toggle = document.getElementById('mode-toggle');
  const controls = document.getElementById('controls');
  const stationBar = document.getElementById('station-bar');

  if (guidedMode) {
    toggle.classList.add('active');
    toggle.textContent = 'FREE SCRUB';
    stationBar.style.display = 'block';
    buildStationTrack();
    // Stop play if running
    if (playing && playTween) {
      playTween.kill();
      playBtn.textContent = 'PLAY';
      playing = false;
    }
  } else {
    toggle.classList.remove('active');
    toggle.textContent = 'GUIDED TOUR';
    stationBar.style.display = 'none';
    exitCutscene();
    activeStationIndex = -1;
  }
}

function buildStationTrack() {
  const track = document.getElementById('station-track');
  track.innerHTML = '';
  STATIONS.forEach((s, i) => {
    if (i > 0) {
      const line = document.createElement('div');
      line.className = 'station-line';
      track.appendChild(line);
    }
    const item = document.createElement('div');
    item.className = 'station-item';
    const dot = document.createElement('div');
    dot.className = 'station-dot';
    dot.dataset.index = i;
    dot.onclick = () => goToStation(i);
    const label = document.createElement('div');
    label.className = 'station-label';
    label.textContent = s.label;
    item.appendChild(dot);
    item.appendChild(label);
    track.appendChild(item);
    if (i < STATIONS.length - 1) {
      const line2 = document.createElement('div');
      line2.className = 'station-line';
      track.appendChild(line2);
    }
  });
}

let stationTimeline = null;

function goToStation(index) {
  // Kill any in-flight station animation
  if (stationTimeline) stationTimeline.kill();
  if (playTween) { playTween.kill(); playBtn.textContent = 'PLAY'; playing = false; }

  const station = STATIONS[index];
  activeStationIndex = index;
  closeCard();

  // Update station dot highlights
  document.querySelectorAll('.station-dot').forEach((d, i) => {
    d.classList.toggle('active', i === index);
  });

  const flyDuration = 2.5;
  const proxy = { year: currentYear };

  // Camera fly-to (deck.gl handles its own interpolation)
  deckgl.setProps({
    initialViewState: {
      ...station.camera,
      transitionDuration: flyDuration * 1000,
      transitionInterpolator: new deck.FlyToInterpolator(),
    }
  });

  // GSAP timeline: year tween synced to camera, then cutscene
  stationTimeline = gsap.timeline();

  stationTimeline.to(proxy, {
    year: station.targetYear,
    duration: flyDuration,
    ease: 'power3.out',
    onUpdate: () => syncYear(proxy.year),
  });

  if (cutsceneMode === 'overlay') {
    stationTimeline.call(() => openCutscene(station), null, `>+0.3`);
  } else if (cutsceneMode === 'vignette') {
    stationTimeline.call(() => openVignette(station), null, `>+0.3`);
  }
}

function openCutscene(station) {
  cutsceneOpen = true;
  const cs = station.cutscene;
  const el = document.getElementById('cutscene');

  document.getElementById('cs-era').textContent = cs.era;
  document.getElementById('cs-era').style.color = cs.eraColor;
  document.getElementById('cs-title').textContent = cs.title;
  document.getElementById('cs-years').textContent = cs.years;

  // Photos (placeholders)
  const photosEl = document.getElementById('cs-photos');
  photosEl.innerHTML = '';
  cs.photos.forEach(label => {
    const div = document.createElement('div');
    div.className = 'cs-photo';
    div.textContent = label;
    photosEl.appendChild(div);
  });

  // Quote
  const quoteEl = document.getElementById('cs-quote');
  quoteEl.style.borderColor = cs.eraColor;
  quoteEl.innerHTML = cs.quote + '<div class="cs-attribution">' + cs.attribution + '</div>';

  document.getElementById('cs-body').textContent = cs.body;

  // Next button
  const nextBtn = document.getElementById('cs-next-btn');
  if (activeStationIndex >= STATIONS.length - 1) {
    nextBtn.textContent = 'BACK TO START';
  } else {
    nextBtn.textContent = 'NEXT STATION →';
  }

  // Kill previous cutscene animation
  if (cutsceneTl) cutsceneTl.kill();

  // Reset reveals to hidden
  const reveals = el.querySelectorAll('.cs-reveal');
  gsap.set(reveals, { opacity: 0, y: 16 });

  // Compose the entrance timeline
  cutsceneTl = gsap.timeline();

  // Backdrop fade
  cutsceneTl.to(el, {
    backgroundColor: 'rgba(0,0,0,0.85)',
    duration: 0.8,
    ease: 'power2.out',
    onStart: () => {
      el.style.pointerEvents = 'auto';
      el.classList.add('active');
    }
  });

  // Staggered content reveal
  cutsceneTl.to(reveals, {
    opacity: 1,
    y: 0,
    duration: 0.5,
    stagger: 0.1,
    ease: 'power2.out',
  }, '-=0.3');
}

function exitCutscene() {
  cutsceneOpen = false;
  const el = document.getElementById('cutscene');
  const reveals = el.querySelectorAll('.cs-reveal');

  if (cutsceneTl) cutsceneTl.kill();

  cutsceneTl = gsap.timeline({
    onComplete: () => {
      el.classList.remove('active');
      el.style.pointerEvents = 'none';
      el.style.backgroundColor = '';
    }
  });

  // Reveals fade out fast
  cutsceneTl.to(reveals, {
    opacity: 0,
    y: -10,
    duration: 0.3,
    stagger: 0.04,
    ease: 'power2.in',
  });

  // Backdrop fade
  cutsceneTl.to(el, {
    backgroundColor: 'rgba(0,0,0,0)',
    duration: 0.5,
    ease: 'power2.in',
  }, '-=0.15');
}

// ── 3D Vignette mode ──
let vignetteTl = null;

function openVignette(station) {
  cutsceneOpen = true;
  const el = document.getElementById('vignette');
  const items = document.getElementById('vignette-items');
  const eraLabel = document.getElementById('vignette-era-label');
  const nav = el.querySelector('.vignette-nav');
  const cs = station.cutscene;

  // Build artifact cards
  items.innerHTML = '';
  (station.vignette || []).forEach(v => {
    const card = document.createElement('div');
    card.className = 'vignette-card';
    card.innerHTML = `
      <div class="vc-icon">${v.icon}</div>
      <div class="vc-label">${v.label}</div>
      <div class="vc-year">${v.year}</div>
    `;
    items.appendChild(card);
  });

  // Era label
  eraLabel.textContent = cs.title.toUpperCase();
  eraLabel.style.color = cs.eraColor;

  // Next button
  const nextBtn = document.getElementById('vignette-next-btn');
  if (activeStationIndex >= STATIONS.length - 1) {
    nextBtn.textContent = 'BACK TO START';
  } else {
    nextBtn.textContent = 'NEXT STATION →';
  }

  el.classList.add('active');

  // Kill previous
  if (vignetteTl) vignetteTl.kill();

  const cards = items.querySelectorAll('.vignette-card');
  gsap.set(cards, { opacity: 0, y: 30, scale: 0.95 });
  gsap.set(eraLabel, { opacity: 0 });
  gsap.set(nav, { opacity: 0 });

  vignetteTl = gsap.timeline();

  // Era name fades in center
  vignetteTl.to(eraLabel, {
    opacity: 0.6,
    duration: 1,
    ease: 'power2.out',
  });

  // Cards rise one by one
  vignetteTl.to(cards, {
    opacity: 1, y: 0, scale: 1,
    duration: 0.6,
    stagger: 0.25,
    ease: 'power2.out',
  }, '-=0.5');

  // Era label fades down
  vignetteTl.to(eraLabel, {
    opacity: 0.15,
    duration: 0.8,
    ease: 'power2.out',
  }, '-=0.3');

  // Nav appears
  vignetteTl.to(nav, {
    opacity: 1,
    duration: 0.4,
    ease: 'power2.out',
  }, '-=0.3');
}

function exitVignette() {
  cutsceneOpen = false;
  const el = document.getElementById('vignette');
  const cards = el.querySelectorAll('.vignette-card');
  const eraLabel = document.getElementById('vignette-era-label');
  const nav = el.querySelector('.vignette-nav');

  if (vignetteTl) vignetteTl.kill();

  vignetteTl = gsap.timeline({
    onComplete: () => {
      el.classList.remove('active');
    }
  });

  vignetteTl.to(nav, { opacity: 0, duration: 0.2, ease: 'power2.in' });
  vignetteTl.to(cards, {
    opacity: 0, y: -15, scale: 0.95,
    duration: 0.3, stagger: 0.06, ease: 'power2.in',
  }, '-=0.1');
  vignetteTl.to(eraLabel, { opacity: 0, duration: 0.3, ease: 'power2.in' }, '-=0.2');
}

// ── Next station (handles both modes) ──
function nextStation() {
  const next = (activeStationIndex + 1) % STATIONS.length;

  if (cutsceneMode === 'vignette') {
    exitVignette();
    vignetteTl.eventCallback('onComplete', () => {
      document.getElementById('vignette').classList.remove('active');
      goToStation(next);
    });
  } else {
    exitCutscene();
    cutsceneTl.eventCallback('onComplete', () => {
      const el = document.getElementById('cutscene');
      el.classList.remove('active');
      el.style.pointerEvents = 'none';
      el.style.backgroundColor = '';
      goToStation(next);
    });
  }
}
</script>
