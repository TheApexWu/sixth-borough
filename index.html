<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SIXTH BOROUGH</title>
<script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://unpkg.com/deck.gl@9.1.4/dist.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; overflow: hidden; font-family: 'Courier New', monospace; color: #ddd; }
  #map { width: 100vw; height: 100vh; }

  /* ── Title ── */
  #title-bar {
    position: fixed; top: 24px; left: 24px; z-index: 10;
    pointer-events: none;
  }
  #title-bar h1 { font-size: 26px; letter-spacing: 4px; color: #fff; }
  #title-bar .sub { font-size: 11px; color: #555; letter-spacing: 1px; margin-top: 4px; }

  /* ── Era legend (vertical, right side) ── */
  #legend {
    position: fixed; top: 24px; right: 24px; z-index: 25;
    background: rgba(0,0,0,0.85); border: 1px solid #282828; padding: 14px 16px;
  }
  #legend h3 { font-size: 11px; letter-spacing: 3px; color: #00b8d4; margin-bottom: 10px; }
  .leg {
    display: flex; align-items: center; margin: 3px 0; font-size: 11px; color: #888;
    cursor: pointer;
  }
  .leg:hover { color: #ccc; }
  .leg.active { color: #ccc; }
  .leg .sw { width: 10px; height: 10px; margin-right: 8px; border: 1px solid #333; }

  /* ── Timeline controls ── */
  #controls {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 25;
    background: rgba(0,0,0,0.92); border: 1px solid #282828; padding: 18px 44px;
    text-align: center; min-width: 520px;
  }
  #controls .label { font-size: 11px; letter-spacing: 4px; color: #00b8d4; }
  #year-display { font-size: 56px; font-weight: bold; color: #fff; margin: 6px 0; font-variant-numeric: tabular-nums; }
  #era-label { font-size: 11px; color: #666; letter-spacing: 2px; margin-bottom: 14px; }
  #slider {
    width: 100%; -webkit-appearance: none; height: 3px;
    background: #282828; outline: none; cursor: pointer;
    margin: 0; padding: 0;
  }
  #slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: #00b8d4; border-radius: 50%; cursor: pointer;
  }
  #slider::-moz-range-thumb {
    width: 14px; height: 14px;
    background: #00b8d4; border-radius: 50%; cursor: pointer; border: none;
  }
  #stats { margin-top: 8px; font-size: 10px; color: #555; }
  #slider-wrap { position: relative; width: 100%; height: 14px; }
  #slider-wrap input {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 2; margin: 0;
  }
  .era-dot {
    position: absolute; z-index: 3;
    top: -2px;
    width: 18px; height: 18px; border-radius: 50%;
    border: 3px solid #444; background: transparent; cursor: pointer;
    transform: translateX(-50%);
    transition: border-color 0.3s, width 0.2s, height 0.2s, top 0.2s;
  }
  .era-dot:hover {
    border-color: #666;
    width: 22px; height: 22px; top: -4px;
  }
  .era-dot-label {
    position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    font-size: 8px; color: #333; letter-spacing: 1px; white-space: nowrap;
    pointer-events: none; opacity: 0; transition: opacity 0.3s, color 0.3s;
  }
  .era-dot:hover .era-dot-label { opacity: 1; color: #666; }
  #play-btn {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: none; border: 1px solid #333; color: #888; font-family: inherit;
    font-size: 11px; padding: 6px 12px; cursor: pointer; letter-spacing: 1px;
  }
  #play-btn:hover { color: #00b8d4; border-color: #00b8d4; }

  /* ── Mode toggle ── */
  #mode-toggle {
    position: fixed; bottom: 28px; left: 24px; z-index: 10;
    background: rgba(0,0,0,0.92); border: 1px solid #282828;
    color: #888; font-family: inherit; font-size: 10px; letter-spacing: 2px;
    padding: 10px 16px; cursor: pointer;
  }
  #mode-toggle:hover { color: #00b8d4; border-color: #00b8d4; }
  #mode-toggle.active { color: #00b8d4; border-color: #00b8d4; }

  /* ── Station bar (guided mode) ── */
  #station-bar {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(0,0,0,0.92); border: 1px solid #282828; padding: 18px 44px;
    text-align: center; min-width: 520px; display: none;
  }
  #station-bar .label { font-size: 11px; letter-spacing: 4px; color: #00b8d4; margin-bottom: 14px; }
  .station-track {
    display: flex; align-items: center; justify-content: center; gap: 0; margin: 16px 0 8px;
    position: relative;
  }
  .station-line {
    height: 2px; background: #282828; flex: 1;
  }
  .station-dot {
    width: 16px; height: 16px; border-radius: 50%; border: 2px solid #444;
    background: #111; cursor: pointer; position: relative; z-index: 1;
    transition: border-color 0.3s, background 0.3s;
  }
  .station-dot:hover { border-color: #00b8d4; }
  .station-dot.active { border-color: #00b8d4; background: #00b8d4; }
  .station-label {
    font-size: 9px; color: #555; letter-spacing: 1px; margin-top: 6px;
  }
  .station-item { display: flex; flex-direction: column; align-items: center; }
  #station-nav {
    margin-top: 10px; font-size: 10px; color: #555;
  }

  /* ── Cutscene overlay ── */
  #cutscene {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 20;
    background: rgba(0,0,0,0); pointer-events: none;
  }
  #cutscene-inner {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr auto;
    gap: 0 48px;
    width: 100%; height: 100%;
    padding: 60px 60px 40px;
    box-sizing: border-box;
  }

  .cs-reveal {
    opacity: 0; transform: translateY(16px);
    will-change: opacity, transform;
  }

  /* Left column: type stack */
  .cs-left {
    grid-column: 1; grid-row: 1 / 3;
    display: flex; flex-direction: column; justify-content: center;
    padding-right: 24px;
  }
  .cs-era {
    font-size: 10px; letter-spacing: 6px; margin-bottom: 16px;
  }
  .cs-title {
    font-size: 48px; font-weight: bold; color: #fff; line-height: 1.08;
    margin-bottom: 8px;
  }
  .cs-years {
    font-size: 12px; color: #444; letter-spacing: 3px; margin-bottom: 40px;
  }
  .cs-quote {
    border-left: 2px solid; padding: 16px 24px; margin-bottom: 0;
    font-size: 16px; color: #bbb; font-style: italic; line-height: 1.7;
    max-width: 420px;
  }
  .cs-attribution {
    font-size: 10px; color: #444; font-style: normal; margin-top: 12px; letter-spacing: 1px;
  }

  /* Right column: photos + body */
  .cs-right {
    grid-column: 2; grid-row: 1 / 3;
    display: flex; flex-direction: column; justify-content: center;
    gap: 16px;
  }
  .cs-photos {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    overflow: hidden;
  }
  .cs-photo {
    height: 160px; background: #0a0a0a; border: 1px solid #1a1a1a;
    overflow: hidden; position: relative;
  }
  .cs-photo:first-child {
    grid-column: 1 / 3; height: 220px;
  }
  .cs-photo img {
    width: 100%; height: 100%; object-fit: cover;
    filter: grayscale(0.3) contrast(1.1);
    transition: filter 1.2s ease;
  }
  .cs-photo:hover img {
    filter: grayscale(0) contrast(1);
  }
  .cs-photo .photo-caption {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 20px 10px 6px;
    background: linear-gradient(transparent, rgba(0,0,0,0.8));
    font-size: 9px; color: #666; letter-spacing: 1px;
  }

  .cs-body {
    font-size: 12px; color: #666; line-height: 1.85; max-width: 440px;
  }

  /* Bottom: buttons span full width */
  .cs-bottom {
    grid-column: 1 / 3; grid-row: 3;
    display: flex; justify-content: flex-end; align-items: flex-end;
    gap: 12px; padding-top: 16px;
  }
  .cs-btn {
    background: none; border: 1px solid #333; color: #888; font-family: inherit;
    font-size: 10px; letter-spacing: 2px; padding: 10px 20px; cursor: pointer;
    transition: color 0.3s, border-color 0.3s, transform 0.15s;
  }
  .cs-btn:hover { color: #00b8d4; border-color: #00b8d4; transform: translateY(-1px); }
  .cs-btn:active { transform: translateY(0); }
  .cs-btn.primary { border-color: #00b8d4; color: #00b8d4; }

  /* Timeline collapses during overlay cutscene */
  #controls.cutscene-active {
    padding: 8px 24px; min-width: auto;
  }
  #controls.cutscene-active .label,
  #controls.cutscene-active #era-label,
  #controls.cutscene-active #stats,
  #controls.cutscene-active #play-btn,
  #controls.cutscene-active #slider-wrap {
    display: none;
  }
  #controls.cutscene-active #year-display {
    font-size: 18px; margin: 0;
  }
  /* Timeline stays full and above vignette */
  #controls.vignette-active {
    z-index: 28;
  }

  /* ── Dev tools panel ── */
  #dev-panel {
    position: fixed; top: 0; right: 0; z-index: 40;
    width: 280px; height: 100vh;
    background: rgba(6,6,6,0.96); border-left: 1px solid #222;
    transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    overflow-y: auto; padding: 0;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  #dev-panel.open { transform: translateX(0); }
  #dev-panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; border-bottom: 1px solid #1a1a1a;
    position: sticky; top: 0; background: rgba(6,6,6,0.98); z-index: 1;
  }
  #dev-panel-header h4 {
    font-size: 10px; letter-spacing: 3px; color: #555; margin: 0;
  }
  #dev-close {
    background: none; border: none; color: #444; font-size: 16px;
    cursor: pointer; font-family: inherit; padding: 0;
  }
  #dev-close:hover { color: #888; }
  #dev-toggle {
    position: fixed; top: 16px; right: 16px; z-index: 35;
    background: rgba(0,0,0,0.8); border: 1px solid #282828;
    color: #444; font-family: inherit; font-size: 9px; letter-spacing: 2px;
    padding: 6px 10px; cursor: grab; user-select: none;
    transition: color 0.3s, border-color 0.3s;
  }
  #dev-toggle:hover { color: #888; border-color: #444; }
  #dev-toggle.dragging { cursor: grabbing; opacity: 0.8; }
  .flag-section {
    padding: 14px 18px 8px; border-bottom: 1px solid #111;
  }
  .flag-section-title {
    font-size: 9px; letter-spacing: 2px; color: #333; margin-bottom: 10px;
    text-transform: uppercase;
  }
  .flag-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 0;
  }
  .flag-label { font-size: 11px; color: #888; }
  .flag-desc { font-size: 9px; color: #333; margin-top: 2px; }
  .flag-toggle {
    position: relative; width: 32px; height: 16px; cursor: pointer; flex-shrink: 0;
  }
  .flag-toggle input { opacity: 0; width: 0; height: 0; }
  .flag-slider {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: #222; border-radius: 8px; transition: background 0.3s;
  }
  .flag-slider::before {
    content: ''; position: absolute; left: 2px; top: 2px;
    width: 12px; height: 12px; border-radius: 50%;
    background: #555; transition: transform 0.3s, background 0.3s;
  }
  .flag-toggle input:checked + .flag-slider { background: #0a3d47; }
  .flag-toggle input:checked + .flag-slider::before { transform: translateX(16px); background: #00b8d4; }

  /* Radio-style mode selector */
  .mode-option {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 8px 0; cursor: pointer;
  }
  .mode-option:hover .mode-name { color: #ccc; }
  .mode-radio {
    width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #444;
    background: #111; flex-shrink: 0; margin-top: 1px;
    transition: border-color 0.3s, background 0.3s;
    display: flex; align-items: center; justify-content: center;
  }
  .mode-radio::after {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: transparent; transition: background 0.3s;
  }
  .mode-option.active .mode-radio { border-color: #00b8d4; }
  .mode-option.active .mode-radio::after { background: #00b8d4; }
  .mode-name { font-size: 11px; color: #888; transition: color 0.2s; }
  .mode-desc { font-size: 9px; color: #444; margin-top: 2px; line-height: 1.4; }

  /* ── 3D Vignette overlay ── */
  #vignette {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 26;
    pointer-events: none;
  }
  #vignette.active { pointer-events: auto; }

  .vignette-items {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  }

  /* Each card is absolutely positioned — JS places them in a composed layout */
  .vignette-card {
    position: absolute;
    background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    opacity: 0; will-change: opacity, transform;
  }
  .vignette-card .vc-icon {
    width: 100%; aspect-ratio: 1; background: rgba(10,10,10,0.8);
    border: 1px solid #1a1a1a;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .vignette-card .vc-label {
    font-size: 10px; letter-spacing: 2px; color: #777;
    text-align: center; padding: 12px 8px 4px;
  }
  .vignette-card .vc-year {
    font-size: 9px; color: #444; text-align: center; padding-bottom: 10px;
  }

  .vignette-era-label {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 72px; font-weight: bold; letter-spacing: 12px;
    color: #fff; opacity: 0; will-change: opacity;
    pointer-events: none; text-align: center; line-height: 1;
  }
  .vignette-era-sub {
    font-size: 12px; letter-spacing: 6px; font-weight: normal;
    display: block; margin-top: 12px; color: #555;
  }

  .vignette-nav {
    position: fixed; bottom: 100px; right: 60px;
    z-index: 27; display: flex; gap: 12px; opacity: 0;
    will-change: opacity;
  }

  /* ── Story card (scaffold) ── */
  #story-card {
    position: fixed; bottom: 120px; right: 24px; z-index: 10;
    background: rgba(0,0,0,0.92); border: 1px solid #282828;
    width: 320px; display: none;
  }
  #story-card .card-header {
    padding: 12px 16px; border-bottom: 1px solid #1a1a1a;
    font-size: 10px; letter-spacing: 3px; color: #00b8d4;
  }
  #story-card .card-title {
    padding: 12px 16px 4px; font-size: 16px; color: #fff; line-height: 1.3;
  }
  #story-card .card-year {
    padding: 0 16px; font-size: 11px; color: #555;
  }
  #story-card .card-body {
    padding: 10px 16px 16px; font-size: 12px; color: #999; line-height: 1.6;
  }
  #story-card .card-close {
    position: absolute; top: 8px; right: 12px; background: none; border: none;
    color: #555; font-size: 16px; cursor: pointer; font-family: inherit;
  }
  #story-card .card-close:hover { color: #fff; }
  #story-card .card-footer {
    padding: 8px 16px 12px; border-top: 1px solid #1a1a1a;
    font-size: 9px; color: #333; letter-spacing: 1px;
  }

  /* ── Sketch overlay (Sobel edge detection) ── */
  #sketch-overlay {
    position: fixed; top: 0; left: 0; z-index: 19;
    pointer-events: none; display: none;
  }
</style>
</head>
<body>

<div id="title-bar">
  <h1>SIXTH BOROUGH</h1>
  <div class="sub">MANHATTAN / <span id="total-count">--</span> BUILDINGS / 1719-2026</div>
</div>

<div id="legend"></div>

<div id="controls">
  <div class="label">TIMELINE</div>
  <div id="year-display">1925</div>
  <div id="era-label">GOLDEN AGE</div>
  <div id="slider-wrap">
    <input type="range" id="slider" min="1719" max="2026" value="1925" step="1">
  </div>
  <div id="stats"><span id="visible-count">--</span> buildings visible</div>
  <button id="play-btn">PLAY</button>
</div>

<!-- Story card scaffold -- Carson/James decide layout, fonts, tone -->
<div id="story-card">
  <button class="card-close" onclick="closeCard()">&times;</button>
  <div class="card-header">SITE HISTORY</div>
  <div class="card-title" id="card-title">--</div>
  <div class="card-year" id="card-year">--</div>
  <div class="card-body" id="card-body">--</div>
  <div class="card-footer">NARRATED BY NEMOTRON 3 NANO / GB10 BLACKWELL</div>
</div>

<button id="dev-toggle">DEV</button>
<div id="dev-panel">
  <div id="dev-panel-header">
    <h4>FEATURE FLAGS</h4>
    <button id="dev-close" onclick="toggleDevPanel()">&times;</button>
  </div>
  <div id="dev-panel-body"></div>
</div>

<!-- 3D Vignette overlay (alternative to cutscene) -->
<div id="vignette">
  <div class="vignette-era-label" id="vignette-era-label"><span class="vignette-era-sub" id="vignette-era-sub"></span></div>
  <div class="vignette-items" id="vignette-items"></div>
  <div class="vignette-nav">
    <button class="cs-btn" id="vignette-prev-btn" onclick="prevStation()">← PREV ERA</button>
    <button class="cs-btn" onclick="exitVignette()">EXPLORE THIS ERA</button>
    <button class="cs-btn primary" id="vignette-next-btn" onclick="nextStation()">NEXT ERA →</button>
  </div>
</div>

<button id="mode-toggle" onclick="toggleMode()">GUIDED TOUR</button>

<div id="station-bar">
  <div class="label">GUIDED TOUR</div>
  <div class="station-track" id="station-track"></div>
  <div id="station-nav"></div>
</div>

<!-- Cutscene overlay -->
<div id="cutscene">
  <div id="cutscene-inner">
    <div class="cs-left">
      <div class="cs-reveal"><div class="cs-era" id="cs-era">ERA</div></div>
      <div class="cs-reveal"><div class="cs-title" id="cs-title">--</div></div>
      <div class="cs-reveal"><div class="cs-years" id="cs-years">--</div></div>
      <div class="cs-reveal"><div class="cs-quote" id="cs-quote">--</div></div>
    </div>
    <div class="cs-right">
      <div class="cs-reveal"><div class="cs-photos" id="cs-photos"></div></div>
      <div class="cs-reveal"><div class="cs-body" id="cs-body">--</div></div>
    </div>
    <div class="cs-bottom cs-reveal">
      <button class="cs-btn" id="cs-prev-btn" onclick="prevStation()">← PREV ERA</button>
      <button class="cs-btn" onclick="exitCutscene()">EXPLORE THIS ERA</button>
      <button class="cs-btn primary" id="cs-next-btn" onclick="nextStation()">NEXT ERA →</button>
    </div>
  </div>
</div>

<div id="map"></div>

<script>
const { Deck, PolygonLayer } = deck;

// ── Sketch Overlay Feature Gate ──
// Synced from FLAGS/featureFlags system below; runtime-toggleable via dev panel
const FEATURES = {
  sketchOverlay: false,  // Sobel edge-detection blueprint overlay
};
// Will be set to true/false after FLAGS init — see sketchOverlay sync block below

// ── Feature Flags ──
const FLAGS = {
  eraDots:      { label: 'Era Dots', desc: 'Clickable dots on timeline rail', group: 'ui', default: true },
  guidedMode:   { label: 'Guided Tour Mode', desc: 'Station bar with sequential navigation', group: 'ui', default: true },
  storyCards:   { label: 'Story Cards', desc: 'Info card on building click', group: 'ui', default: true },
  legend:       { label: 'Era Legend', desc: 'Interactive era bar above timeline', group: 'ui', default: true },
  hoverTooltip: { label: 'Hover Tooltip', desc: 'Show building era/info on hover', group: 'ui', default: false },
  sketchOverlay:{ label: 'Sketch Overlay', desc: 'Sobel edge-detection blueprint overlay', group: 'effects', default: false },
};

// Cutscene modes — only one active at a time
const CUTSCENE_MODES = {
  overlay:  { label: 'Overlay Cutscene', desc: 'Full-screen overlay with photos, quotes, and text. Covers the map.' },
  vignette: { label: '3D Vignette', desc: 'Floating artifact cards appear in-world over the map. No overlay — the city stays visible.' },
  off:      { label: 'Off', desc: 'No cutscene after flying to a station.' },
};

// Load from localStorage, fall back to defaults
const featureFlags = {};
for (const [key, def] of Object.entries(FLAGS)) {
  const stored = localStorage.getItem('ff_' + key);
  featureFlags[key] = stored !== null ? stored === 'true' : def.default;
}
// Sync FEATURES gate with featureFlags
FEATURES.sketchOverlay = featureFlags.sketchOverlay;
let cutsceneMode = localStorage.getItem('ff_cutsceneMode') || 'overlay';

function setFlag(key, val) {
  featureFlags[key] = val;
  localStorage.setItem('ff_' + key, val);
  applyFlags();
}

function setCutsceneMode(mode) {
  // Clear any active cutscene/vignette before switching
  clearAllOverlays();
  cutsceneMode = mode;
  localStorage.setItem('ff_cutsceneMode', mode);
  document.querySelectorAll('.mode-option').forEach(el => {
    el.classList.toggle('active', el.dataset.mode === mode);
  });
}

function clearAllOverlays() {
  const cutscene = document.getElementById('cutscene');
  cutscene.classList.remove('active');
  cutscene.style.pointerEvents = 'none';
  cutscene.style.backgroundColor = '';
  gsap.set(cutscene.querySelectorAll('.cs-reveal'), { opacity: 0, y: 16 });

  const vignette = document.getElementById('vignette');
  vignette.classList.remove('active');
  vignette.querySelector('.vignette-items').innerHTML = '';
  gsap.set(document.getElementById('vignette-era-label'), { opacity: 0 });

// ── Draggable DEV button ──
(function() {
  const btn = document.getElementById('dev-toggle');
  let dragging = false, hasMoved = false;
  let startX, startY, startLeft, startTop;

  btn.addEventListener('pointerdown', (e) => {
    dragging = true;
    hasMoved = false;
    btn.classList.add('dragging');
    btn.setPointerCapture(e.pointerId);
    const rect = btn.getBoundingClientRect();
    startX = e.clientX;
    startY = e.clientY;
    startLeft = rect.left;
    startTop = rect.top;
    // Switch from right-anchored to left-anchored for dragging
    btn.style.right = 'auto';
    btn.style.left = startLeft + 'px';
    btn.style.top = startTop + 'px';
  });

  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasMoved = true;
    btn.style.left = (startLeft + dx) + 'px';
    btn.style.top = (startTop + dy) + 'px';
  });

  window.addEventListener('pointerup', () => {
    if (!dragging) return;
    dragging = false;
    btn.classList.remove('dragging');
    // Only toggle panel if it was a click, not a drag
    if (!hasMoved) toggleDevPanel();
  });
})();

const ERA_DEFS = [
  { max: 1800, label: 'COLONIAL ERA',            color: [80, 60, 50] },
  { max: 1860, label: 'ANTEBELLUM',              color: [120, 85, 60] },
  { max: 1900, label: 'GILDED AGE',              color: [160, 110, 70] },
  { max: 1930, label: 'GOLDEN AGE',              color: [180, 140, 80] },
  { max: 1945, label: 'ART DECO / DEPRESSION',   color: [100, 130, 160] },
  { max: 1970, label: 'BRUTALISM / MIDCENTURY',   color: [130, 130, 130] },
  { max: 2000, label: 'POSTMODERN',              color: [90, 110, 90] },
  { max: 9999, label: 'GLASS TOWER ERA',         color: [60, 180, 200] },
];

// Era ranges for legend display (min is inclusive, max from ERA_DEFS is exclusive)
const ERA_RANGES = [
  { min: 0,    max: 1800, label: 'COLONIAL',    shortYears: 'PRE-1800' },
  { min: 1800, max: 1860, label: 'ANTEBELLUM',  shortYears: '1800–1860' },
  { min: 1860, max: 1900, label: 'GILDED AGE',  shortYears: '1860–1900' },
  { min: 1900, max: 1930, label: 'GOLDEN AGE',  shortYears: '1900–1930' },
  { min: 1930, max: 1945, label: 'ART DECO',    shortYears: '1930–1945' },
  { min: 1945, max: 1970, label: 'MIDCENTURY',  shortYears: '1945–1970' },
  { min: 1970, max: 2000, label: 'POSTMODERN',  shortYears: '1970–2000' },
  { min: 2000, max: 9999, label: 'GLASS TOWER', shortYears: '2000+' },
];

function getEra(year) {
  for (const e of ERA_DEFS) { if (year < e.max) return e; }
  return ERA_DEFS[ERA_DEFS.length - 1];
}

function getEraIndex(year) {
  for (let i = 0; i < ERA_DEFS.length; i++) { if (year < ERA_DEFS[i].max) return i; }
  return ERA_DEFS.length - 1;
}

// ── Interactive era legend ──
function buildLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = '<h3>ERA</h3>';
  ERA_DEFS.forEach((era, i) => {
    const range = ERA_RANGES[i];
    const leg = document.createElement('div');
    leg.className = 'leg';
    leg.dataset.eraIndex = i;

    const sw = document.createElement('div');
    sw.className = 'sw';
    sw.style.background = `rgb(${era.color.join(',')})`;

    leg.appendChild(sw);
    leg.appendChild(document.createTextNode(range.shortYears));

    leg.addEventListener('click', () => {
      const stationIdx = findStationForEra(i);
      if (stationIdx !== -1) {
        goToStation(stationIdx);
      } else {
        const midYear = range.max === 9999 ? 2020 : Math.round((range.min + range.max) / 2);
        const proxy = { year: currentYear };
        gsap.to(proxy, { year: midYear, duration: 1.5, ease: 'power3.out', onUpdate: () => syncYear(proxy.year) });
      }
    });

    legend.appendChild(leg);
  });
  updateLegendHighlight();
}

function findStationForEra(eraIndex) {
  const range = ERA_RANGES[eraIndex];
  for (let i = 0; i < STATIONS.length; i++) {
    if (STATIONS[i].targetYear >= range.min && STATIONS[i].targetYear < range.max) return i;
  }
  return -1;
}

function updateLegendHighlight() {
  const activeIdx = getEraIndex(currentYear);
  document.querySelectorAll('#legend .leg').forEach((leg, i) => {
    leg.classList.toggle('active', i === activeIdx);
  });
}

function initDeck() {
  deckgl = new Deck({
    parent: document.getElementById('map'),
    initialViewState: {
      latitude: 40.758,
      longitude: -73.985,
      zoom: 14,
      pitch: 55,
      bearing: -20,
      maxZoom: 18,
      minZoom: 10,
    },
    controller: true,
    glOptions: { preserveDrawingBuffer: true },
    layers: [buildLayer()],
    getTooltip: ({object}) => {
      if (!object || !featureFlags.hoverTooltip) return null;
      const era = getEra(object.y);
      return {
        html: `<b>${era.label}</b><br>Built: ${object.y || '?'}<br>Height: ${object.h}m<br>BIN: ${object.b}`,
        style: { backgroundColor: 'rgba(0,0,0,0.9)', color: '#ddd', fontFamily: "'Courier New', monospace", fontSize: '11px', padding: '8px 12px', borderLeft: '2px solid #00b8d4' }
      };
    },
    onClick: ({object}) => {
      if (!object) return;
      showCard(object);
    },
  });
}

function buildLayer() {
  return new PolygonLayer({
    id: 'buildings',
    data: buildings,
    getPolygon: d => d.p,
    // Height grow: buildings built after currentYear get 0 height.
    // Buildings built AT currentYear get partial height (grow effect within a 3-year window).
    getElevation: d => {
      if (d.y === 0) return d.h;  // unknown year, always show
      if (d.y > currentYear) return 0;
      // Grow over a 3-year window ending at construction year
      const growStart = d.y - 3;
      if (currentYear < growStart) return 0;
      if (currentYear >= d.y) return d.h;
      // Lerp: fraction of the 3-year grow window
      const t = (currentYear - growStart) / 3;
      return d.h * t;
    },
    getFillColor: d => {
      if (d.y > currentYear && d.y !== 0) return [0, 0, 0, 0]; // invisible future
      const era = getEra(d.y || 1800);
      // Fade in during grow window
      let alpha = 200;
      if (d.y !== 0 && d.y > 0) {
        const growStart = d.y - 3;
        if (currentYear < d.y && currentYear >= growStart) {
          alpha = Math.floor(80 + 120 * ((currentYear - growStart) / 3));
        }
      }
      return [...era.color, alpha];
    },
    extruded: true,
    wireframe: false,
    pickable: true,
    elevationScale: 1,
    material: {
      ambient: 0.4,
      diffuse: 0.6,
      shininess: 10,
      specularColor: [30, 30, 30],
    },
    updateTriggers: {
      getElevation: currentYear,
      getFillColor: currentYear,
    },
    transitions: {
      getElevation: { duration: 200, easing: t => t },
    },
  });
}

// ── Play button (GSAP-driven timeline scrub) ──
const playBtn = document.getElementById('play-btn');
let playTween = null;

function syncYear(year) {
  currentYear = Math.round(year);
  slider.value = currentYear;
  yearDisplay.textContent = currentYear;
  eraLabel.textContent = getEra(currentYear).label;
  updateVisibleCount();
  updateLegendHighlight();
  if (deckgl) deckgl.setProps({ layers: [buildLayer()] });
}

playBtn.addEventListener('click', () => {
  if (playing) {
    playTween.kill();
    playBtn.textContent = 'PLAY';
    playing = false;
  } else {
    const startFrom = currentYear >= 2026 ? 1719 : currentYear;
    const yearsToGo = 2026 - startFrom;
    const duration = yearsToGo / 20; // ~20 years/second
    playing = true;
    playBtn.textContent = 'STOP';
    const proxy = { year: startFrom };
    playTween = gsap.to(proxy, {
      year: 2026,
      duration,
      ease: 'none',
      onUpdate: () => syncYear(proxy.year),
      onComplete: () => {
        playBtn.textContent = 'PLAY';
        playing = false;
      }
    });
  }
});

  card.style.display = 'block';
}

// ── Era dots on timeline ──
function buildEraDots() {
  const wrap = document.getElementById('slider-wrap');
  const min = 1719, max = 2026;
  const thumbHalf = 7; // half of 14px thumb
  STATIONS.forEach((s, i) => {
    const pct = ((s.targetYear - min) / (max - min)) * 100;
    const dot = document.createElement('div');
    dot.className = 'era-dot';
    // Map percentage into the slider's usable track range (thumbHalf to 100% - thumbHalf)
    dot.style.left = `calc(${thumbHalf}px + ${pct} * (100% - ${thumbHalf * 2}px) / 100)`;
    dot.title = s.label;
    dot.innerHTML = '<span class="era-dot-label">' + s.label + '</span>';
    dot.addEventListener('click', (e) => {
      e.stopPropagation();
      goToStation(i);
    });
    wrap.appendChild(dot);
  });
}

let guidedMode = false;
let activeStationIndex = -1;
let cutsceneOpen = false;

function toggleMode() {
  guidedMode = !guidedMode;
  const toggle = document.getElementById('mode-toggle');
  const controls = document.getElementById('controls');
  const stationBar = document.getElementById('station-bar');

  if (guidedMode) {
    toggle.classList.add('active');
    toggle.textContent = 'FREE SCRUB';
    stationBar.style.display = 'block';
    buildStationTrack();
    // Stop play if running
    if (playing && playTween) {
      playTween.kill();
      playBtn.textContent = 'PLAY';
      playing = false;
    }
  } else {
    toggle.classList.remove('active');
    toggle.textContent = 'GUIDED TOUR';
    stationBar.style.display = 'none';
    exitCutscene();
    activeStationIndex = -1;
  }
}

function buildStationTrack() {
  const track = document.getElementById('station-track');
  track.innerHTML = '';
  STATIONS.forEach((s, i) => {
    if (i > 0) {
      const line = document.createElement('div');
      line.className = 'station-line';
      track.appendChild(line);
    }
    const item = document.createElement('div');
    item.className = 'station-item';
    const dot = document.createElement('div');
    dot.className = 'station-dot';
    dot.dataset.index = i;
    dot.onclick = () => goToStation(i);
    const label = document.createElement('div');
    label.className = 'station-label';
    label.textContent = s.label;
    item.appendChild(dot);
    item.appendChild(label);
    track.appendChild(item);
    if (i < STATIONS.length - 1) {
      const line2 = document.createElement('div');
      line2.className = 'station-line';
      track.appendChild(line2);
    }
  });
}

let stationTimeline = null;

function goToStation(index) {
  // Clean up any active overlays and animations
  clearAllOverlays();
  if (stationTimeline) stationTimeline.kill();
  if (playTween) { playTween.kill(); playBtn.textContent = 'PLAY'; playing = false; }

  const station = STATIONS[index];
  activeStationIndex = index;
  closeCard();

  // Update station dot highlights
  document.querySelectorAll('.station-dot').forEach((d, i) => {
    d.classList.toggle('active', i === index);
  });

  const flyDuration = 2.5;
  const proxy = { year: currentYear };

  // Camera fly-to (deck.gl handles its own interpolation)
  deckgl.setProps({
    initialViewState: {
      ...station.camera,
      transitionDuration: flyDuration * 1000,
      transitionInterpolator: new deck.FlyToInterpolator(),
    }
  });

  // GSAP timeline: year tween synced to camera, then cutscene
  stationTimeline = gsap.timeline();

  stationTimeline.to(proxy, {
    year: station.targetYear,
    duration: flyDuration,
    ease: 'power3.out',
    onUpdate: () => syncYear(proxy.year),
  });

  if (cutsceneMode === 'overlay') {
    stationTimeline.call(() => openCutscene(station), null, `>+0.12`);
  } else if (cutsceneMode === 'vignette') {
    stationTimeline.call(() => openVignette(station), null, `>+0.12`);
  }
}

let cutsceneTl = null;

function openCutscene(station) {
  cutsceneOpen = true;
  document.getElementById('controls').classList.add('cutscene-active');
  document.getElementById('legend').style.display = 'none';
  const cs = station.cutscene;
  const el = document.getElementById('cutscene');

  document.getElementById('cs-era').textContent = cs.era;
  document.getElementById('cs-era').style.color = cs.eraColor;
  document.getElementById('cs-title').textContent = cs.title;
  document.getElementById('cs-years').textContent = cs.years;

  // Photos
  const photosEl = document.getElementById('cs-photos');
  photosEl.innerHTML = '';
  cs.photos.forEach(photo => {
    const div = document.createElement('div');
    div.className = 'cs-photo';
    const img = document.createElement('img');
    img.src = typeof photo === 'string' ? '' : photo.src;
    img.alt = typeof photo === 'string' ? photo : photo.caption;
    img.loading = 'eager';
    img.decoding = 'async';
    const cap = document.createElement('div');
    cap.className = 'photo-caption';
    cap.textContent = typeof photo === 'string' ? photo : photo.caption;
    div.appendChild(img);
    div.appendChild(cap);
    photosEl.appendChild(div);
  });

  // Quote
  const quoteEl = document.getElementById('cs-quote');
  quoteEl.style.borderColor = cs.eraColor;
  quoteEl.innerHTML = cs.quote + '<div class="cs-attribution">' + cs.attribution + '</div>';

  document.getElementById('cs-body').textContent = cs.body;

  // Nav buttons
  document.getElementById('cs-prev-btn').style.visibility = activeStationIndex <= 0 ? 'hidden' : '';
  document.getElementById('cs-next-btn').textContent = activeStationIndex >= STATIONS.length - 1 ? 'BACK TO START' : 'NEXT ERA →';

  // Kill previous cutscene animation
  if (cutsceneTl) cutsceneTl.kill();

  // Reset reveals to hidden
  const reveals = el.querySelectorAll('.cs-reveal');
  const photos = el.querySelectorAll('.cs-photo');
  const imgs = el.querySelectorAll('.cs-photo img');
  gsap.set(reveals, { opacity: 0, y: 16 });
  gsap.set(imgs, { scale: 1.15, opacity: 0 });

  // Compose the entrance timeline
  cutsceneTl = gsap.timeline();

  // Backdrop fade (map “fades out” behind overlay)
  cutsceneTl.to(el, {
    backgroundColor: 'rgba(0,0,0,0.88)',
    duration: 0.48,
    ease: 'power2.out',
    onStart: () => {
      el.style.pointerEvents = 'auto';
      el.classList.add('active');
    }
  });

  // Column + chrome reveals
  cutsceneTl.to(reveals, {
    opacity: 1,
    y: 0,
    duration: 0.38,
    stagger: 0.05,
    ease: 'power2.out',
  }, '-=0.32');

  // Photos: Ken Burns + fade (overlap so they don’t wait on full text stagger)
  cutsceneTl.to(imgs, {
    scale: 1,
    opacity: 1,
    duration: 0.58,
    stagger: 0.05,
    ease: 'power2.out',
  }, '-=0.52');
}

function exitCutscene() {
  cutsceneOpen = false;
  document.getElementById('controls').classList.remove('cutscene-active');
  if (featureFlags.legend) document.getElementById('legend').style.display = '';
  const el = document.getElementById('cutscene');
  const reveals = el.querySelectorAll('.cs-reveal');
  const imgs = el.querySelectorAll('.cs-photo img');

  if (cutsceneTl) cutsceneTl.kill();

  cutsceneTl = gsap.timeline({
    onComplete: () => {
      el.classList.remove('active');
      el.style.pointerEvents = 'none';
      el.style.backgroundColor = '';
    }
  });

  // Images zoom out slightly as they fade
  cutsceneTl.to(imgs, {
    scale: 1.08,
    opacity: 0,
    duration: 0.4,
    stagger: 0.06,
    ease: 'power2.in',
  });

  // Reveals fade out
  cutsceneTl.to(reveals, {
    opacity: 0,
    y: -10,
    duration: 0.3,
    stagger: 0.04,
    ease: 'power2.in',
  }, '-=0.3');

  // Backdrop fade
  cutsceneTl.to(el, {
    backgroundColor: 'rgba(0,0,0,0)',
    duration: 0.5,
    ease: 'power2.in',
  }, '-=0.2');
}

// ── 3D Vignette mode ──
let vignetteTl = null;

// Composed positions for 4 artifacts — asymmetric gallery layout
const VIGNETTE_LAYOUTS = [
  // [left%, top%, width_px, rotation_deg]
  { left: '6%',  top: '8%',   width: 220, rotate: -3 },   // top-left, large
  { left: '72%', top: '5%',   width: 180, rotate: 2 },    // top-right
  { left: '2%',  top: '52%',  width: 160, rotate: 1.5 },  // bottom-left
  { left: '65%', top: '48%',  width: 240, rotate: -1.5 }, // bottom-right, hero
];

function openVignette(station) {
  cutsceneOpen = true;
  document.getElementById('controls').classList.add('vignette-active');
  document.getElementById('legend').style.display = 'none';
  const el = document.getElementById('vignette');
  const items = document.getElementById('vignette-items');
  const eraLabel = document.getElementById('vignette-era-label');
  const eraSub = document.getElementById('vignette-era-sub');
  const nav = el.querySelector('.vignette-nav');
  const cs = station.cutscene;

  // Build artifact cards at composed positions
  items.innerHTML = '';
  const artifacts = station.vignette || [];
  artifacts.forEach((v, i) => {
    const layout = VIGNETTE_LAYOUTS[i % VIGNETTE_LAYOUTS.length];
    const card = document.createElement('div');
    card.className = 'vignette-card';
    card.style.left = layout.left;
    card.style.top = layout.top;
    card.style.width = layout.width + 'px';
    card.innerHTML = `
      <div class="vc-icon" style="font-size:${Math.round(layout.width * 0.35)}px">${v.icon}</div>
      <div class="vc-label">${v.label}</div>
      <div class="vc-year">${v.year}</div>
    `;
    items.appendChild(card);
  });

  // Era label — large, atmospheric
  eraLabel.childNodes[0].textContent = cs.title.toUpperCase();
  eraLabel.style.color = cs.eraColor;
  eraSub.textContent = cs.years;

  // Next button
  const nextBtn = document.getElementById('vignette-next-btn');
  document.getElementById('vignette-prev-btn').style.visibility = activeStationIndex <= 0 ? 'hidden' : '';
  nextBtn.textContent = activeStationIndex >= STATIONS.length - 1 ? 'BACK TO START' : 'NEXT ERA →';

  el.classList.add('active');
  if (vignetteTl) vignetteTl.kill();

  const cards = items.querySelectorAll('.vignette-card');

  // Set initial states
  cards.forEach((card, i) => {
    const layout = VIGNETTE_LAYOUTS[i % VIGNETTE_LAYOUTS.length];
    gsap.set(card, { opacity: 0, y: 60, scale: 0.85, rotation: 0 });
  });
  gsap.set(eraLabel, { opacity: 0, scale: 0.95 });
  gsap.set(nav, { opacity: 0 });

  vignetteTl = gsap.timeline();

  // 1. Era title sweeps in large
  vignetteTl.to(eraLabel, {
    opacity: 0.5, scale: 1,
    duration: 1.2,
    ease: 'power3.out',
  });

  // 2. Artifacts rise one by one with rotation, staggered long
  cards.forEach((card, i) => {
    const layout = VIGNETTE_LAYOUTS[i % VIGNETTE_LAYOUTS.length];
    vignetteTl.to(card, {
      opacity: 0.9, y: 0, scale: 1, rotation: layout.rotate,
      duration: 0.8,
      ease: 'power2.out',
    }, `-=${i === 0 ? 0.6 : 0.5}`);
  });

  // 3. Era title recedes to ghost
  vignetteTl.to(eraLabel, {
    opacity: 0.12,
    duration: 1,
    ease: 'power2.out',
  }, '-=0.4');

  // 4. Nav fades in
  vignetteTl.to(nav, {
    opacity: 1,
    duration: 0.5,
    ease: 'power2.out',
  }, '-=0.5');
}

function exitVignette() {
  cutsceneOpen = false;
  document.getElementById('controls').classList.remove('vignette-active');
  if (featureFlags.legend) document.getElementById('legend').style.display = '';
  const el = document.getElementById('vignette');
  const cards = el.querySelectorAll('.vignette-card');
  const eraLabel = document.getElementById('vignette-era-label');
  const nav = el.querySelector('.vignette-nav');

  if (vignetteTl) vignetteTl.kill();

  vignetteTl = gsap.timeline({
    onComplete: () => {
      el.classList.remove('active');
    }
  });

  vignetteTl.to(nav, { opacity: 0, duration: 0.2, ease: 'power2.in' });
  vignetteTl.to(cards, {
    opacity: 0, y: -30, scale: 0.9, rotation: 0,
    duration: 0.4, stagger: 0.08, ease: 'power2.in',
  }, '-=0.1');
  vignetteTl.to(eraLabel, { opacity: 0, duration: 0.3, ease: 'power2.in' }, '-=0.2');
}

// ── Next station (handles both modes) ──
function navigateStation(targetIndex) {
  clearAllOverlays();
  setTimeout(() => goToStation(targetIndex), 100);
}

function nextStation() {
  navigateStation((activeStationIndex + 1) % STATIONS.length);
}

function prevStation() {
  if (activeStationIndex <= 0) return;
  navigateStation(activeStationIndex - 1);
}

// ── Sobel Edge-Detection Sketch Overlay ──
// Functions are always defined; they no-op when FEATURES.sketchOverlay is false.
// initSketchOverlay / teardownSketchOverlay are called from applyFlags().

let _sketchOverlayCanvas = null;
let _sketchResizeHandler = null;
let _sketchTeardownPending = false;

function _syncSketchOverlaySize() {
  const overlay = _sketchOverlayCanvas;
  if (!overlay) return;
  const srcCanvas = deckgl && (deckgl.getCanvas ? deckgl.getCanvas() : deckgl.canvas);
  if (srcCanvas) {
    overlay.width = srcCanvas.width;
    overlay.height = srcCanvas.height;
    overlay.style.width = srcCanvas.clientWidth + 'px';
    overlay.style.height = srcCanvas.clientHeight + 'px';
  } else {
    overlay.width = window.innerWidth;
    overlay.height = window.innerHeight;
    overlay.style.width = window.innerWidth + 'px';
    overlay.style.height = window.innerHeight + 'px';
  }
}

function _getSketchThreshold() {
  const eraIdx = getEraIndex(currentYear);
  // 0=Colonial(heaviest, 0.12) … 7=Glass Tower(thinnest, 0.05)
  return 0.12 - (eraIdx / 7) * 0.07;
}

function _parseSketchColor(str) {
  if (str && str.startsWith('#')) {
    const hex = str.slice(1);
    if (hex.length === 3) {
      return {
        r: parseInt(hex[0] + hex[0], 16),
        g: parseInt(hex[1] + hex[1], 16),
        b: parseInt(hex[2] + hex[2], 16),
      };
    }
    return {
      r: parseInt(hex.slice(0, 2), 16),
      g: parseInt(hex.slice(2, 4), 16),
      b: parseInt(hex.slice(4, 6), 16),
    };
  }
  if (str && str.startsWith('rgb')) {
    const m = str.match(/(\d+)/g);
    if (m && m.length >= 3) return { r: +m[0], g: +m[1], b: +m[2] };
  }
  return { r: 0, g: 184, b: 212 }; // fallback cyan
}

function initSketchOverlay() {
  if (_sketchOverlayCanvas) return; // already initialized
  const overlay = document.createElement('canvas');
  overlay.id = 'sketch-overlay';
  document.body.appendChild(overlay);
  _sketchOverlayCanvas = overlay;

  _sketchResizeHandler = _syncSketchOverlaySize;
  window.addEventListener('resize', _sketchResizeHandler);
  setTimeout(_syncSketchOverlaySize, 500);
}

function teardownSketchOverlay() {
  if (!_sketchOverlayCanvas) return;
  if (_sketchResizeHandler) {
    window.removeEventListener('resize', _sketchResizeHandler);
    _sketchResizeHandler = null;
  }
  _sketchOverlayCanvas.remove();
  _sketchOverlayCanvas = null;
}

/**
 * generateSketchOverlay(eraColor)
 * Captures the deck.gl canvas, runs Sobel edge detection,
 * renders architectural line drawing with the given ink color.
 */
window.generateSketchOverlay = function(eraColor) {
  if (!FEATURES.sketchOverlay || !_sketchOverlayCanvas || !deckgl) return;
  _syncSketchOverlaySize();
  const overlay = _sketchOverlayCanvas;
  // Use deck.gl's own canvas reference — more reliable than querySelector
  const srcCanvas = deckgl.getCanvas ? deckgl.getCanvas() : (deckgl.canvas || document.getElementById('map').querySelector('canvas'));
  if (!srcCanvas) return;

  const w = srcCanvas.width;
  const h = srcCanvas.height;
  if (w === 0 || h === 0) return;

  // Force a synchronous redraw so the buffer has current frame data
  if (deckgl.redraw) deckgl.redraw(true);

  // Read source pixels from WebGL or 2D canvas
  const srcCtx = srcCanvas.getContext('webgl2') || srcCanvas.getContext('webgl');
  let srcPixels;
  if (srcCtx && (srcCtx instanceof WebGLRenderingContext || srcCtx instanceof WebGL2RenderingContext)) {
    srcPixels = new Uint8Array(w * h * 4);
    srcCtx.readPixels(0, 0, w, h, srcCtx.RGBA, srcCtx.UNSIGNED_BYTE, srcPixels);
    // Debug: check if we got actual pixel data
    let nonZero = 0;
    for (let i = 0; i < Math.min(srcPixels.length, 40000); i++) { if (srcPixels[i] > 0) nonZero++; }
    console.log('[sketch] canvas:', w, 'x', h, '| non-zero pixels sampled:', nonZero, '| preserveDrawingBuffer:', srcCtx.getContextAttributes().preserveDrawingBuffer);
    // WebGL readPixels gives bottom-up rows; flip vertically
    const rowSize = w * 4;
    const tmp = new Uint8Array(rowSize);
    for (let y = 0; y < Math.floor(h / 2); y++) {
      const topOff = y * rowSize;
      const botOff = (h - 1 - y) * rowSize;
      tmp.set(srcPixels.subarray(topOff, topOff + rowSize));
      srcPixels.copyWithin(topOff, botOff, botOff + rowSize);
      srcPixels.set(tmp, botOff);
    }
  } else {
    const ctx2d = srcCanvas.getContext('2d');
    srcPixels = ctx2d.getImageData(0, 0, w, h).data;
  }

  // Convert to grayscale luminance
  const gray = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const off = i * 4;
    gray[i] = 0.299 * srcPixels[off] + 0.587 * srcPixels[off + 1] + 0.114 * srcPixels[off + 2];
  }

  // Apply 3x3 Sobel kernels
  const edges = new Float32Array(w * h);
  let maxMag = 0;
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const tl = gray[(y - 1) * w + (x - 1)];
      const tc = gray[(y - 1) * w + x];
      const tr = gray[(y - 1) * w + (x + 1)];
      const ml = gray[y * w + (x - 1)];
      const mr = gray[y * w + (x + 1)];
      const bl = gray[(y + 1) * w + (x - 1)];
      const bc = gray[(y + 1) * w + x];
      const br = gray[(y + 1) * w + (x + 1)];

      const gx = -tl + tr - 2 * ml + 2 * mr - bl + br;
      const gy = -tl - 2 * tc - tr + bl + 2 * bc + br;
      const mag = Math.sqrt(gx * gx + gy * gy);
      edges[y * w + x] = mag;
      if (mag > maxMag) maxMag = mag;
    }
  }

  // Render: dark background (#0a0a0a) with era-colored ink lines
  const ink = _parseSketchColor(eraColor);
  const threshold = maxMag * _getSketchThreshold();
  const outCtx = overlay.getContext('2d');
  const out = outCtx.createImageData(w, h);
  const bg = { r: 10, g: 10, b: 10 };

  for (let i = 0; i < w * h; i++) {
    const off = i * 4;
    const mag = edges[i];
    if (mag > threshold && maxMag > 0) {
      const alpha = Math.min(((mag - threshold) / (maxMag - threshold)) * 0.7, 0.7);
      out.data[off]     = Math.round(bg.r * (1 - alpha) + ink.r * alpha);
      out.data[off + 1] = Math.round(bg.g * (1 - alpha) + ink.g * alpha);
      out.data[off + 2] = Math.round(bg.b * (1 - alpha) + ink.b * alpha);
    } else {
      out.data[off]     = bg.r;
      out.data[off + 1] = bg.g;
      out.data[off + 2] = bg.b;
    }
    out.data[off + 3] = 255;
  }

  outCtx.putImageData(out, 0, 0);
};

/**
 * showSketchOverlay() — GSAP fade in
 */
window.showSketchOverlay = function() {
  if (!FEATURES.sketchOverlay || !_sketchOverlayCanvas) return;
  _sketchOverlayCanvas.style.display = 'block';
  gsap.fromTo(_sketchOverlayCanvas, { opacity: 0 }, { opacity: 1, duration: 0.8, ease: 'power2.out' });
};

/**
 * hideSketchOverlay() — GSAP fade out
 */
window.hideSketchOverlay = function() {
  if (!_sketchOverlayCanvas) return;
  gsap.to(_sketchOverlayCanvas, {
    opacity: 0, duration: 0.6, ease: 'power2.in',
    onComplete: () => { if (_sketchOverlayCanvas) _sketchOverlayCanvas.style.display = 'none'; }
  });
};
